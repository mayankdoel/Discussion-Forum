<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional discussion forum for meaningful conversations and community engagement. Share your thoughts, engage with others, and join the conversation.">
    <meta name="keywords" content="discussion forum, community, conversations, social platform">
    <meta name="author" content="Discussion Forum">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Discussion Forum - Connect & Engage">
    <meta property="og:description" content="Join our professional discussion forum for meaningful conversations and community engagement.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    
    <title>Discussion Forum - Connect & Engage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <h1>Discussion Forum</h1>
                </div>
                <button class="btn-primary" id="newPostBtn">
                    <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Post
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search discussions..." class="search-input">
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <svg class="icon-small stat-icon-posts" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Total Posts</span>
                    </div>
                    <p class="stat-number" id="totalPosts">0</p>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <svg class="icon-small stat-icon-likes" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                        </svg>
                        <span>Total Likes</span>
                    </div>
                    <p class="stat-number" id="totalLikes">0</p>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <svg class="icon-small stat-icon-comments" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>Comments</span>
                    </div>
                    <p class="stat-number" id="totalComments">0</p>
                </div>
            </div>

            <!-- Posts Container -->
            <div id="postsContainer"></div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <p>No posts found. Start a new discussion!</p>
            </div>
        </div>
    </main>

    <!-- New Post Modal -->
    <div id="newPostModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Create New Post</h2>
            <form id="newPostForm">
                <input type="text" id="postAuthor" placeholder="Your Name" required>
                <input type="text" id="postTitle" placeholder="Post Title" required>
                <textarea id="postContent" placeholder="What's on your mind?" required></textarea>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="editPostModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Edit Post</h2>
            <form id="editPostForm">
                <input type="hidden" id="editPostId">
                <input type="text" id="editPostTitle" placeholder="Post Title" required>
                <textarea id="editPostContent" placeholder="What's on your mind?" required></textarea>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" style="display: none;">
        <div class="modal-content modal-small">
            <h2>Delete Post?</h2>
            <p class="delete-message">Are you sure you want to delete this post? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
